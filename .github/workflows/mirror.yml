# Streaming mirror for The Daily Brief Bookshelf chapter audio.
# GitHub Release assets (the canonical store, in carl-m-healy/daily-brief, tags books-<slug>) are served
# as application/octet-stream + Content-Disposition: attachment off a signed redirect. Chrome's media
# loader fails about half the time on that (measured: 2/5 with preload="none", 3/3 sometimes, "Format
# error"); the same problem the article mirror solves for daily-brief-media. This workflow copies every
# book chapter asset into this repo's Pages site, deployed from an artifact (nothing is committed to git,
# so the repo never grows), where it is served with Content-Type: audio/mpeg and HTTP Range support.
#
# It is a separate repo from daily-brief-media on purpose: that one is at 899 MB of its 1 GB Pages cap
# with article audio, and a 40-90 minute chapter of a novel is 20-45 MB. Books get their own budget.
name: mirror
on:
  workflow_dispatch:
    inputs:
      budget_mb:
        description: Max total size of the mirrored files (Pages sites are limited to 1 GB)
        required: false
        default: "900"
  schedule:
    - cron: "23 10 * * *"   # daily safety net (03:23 Phoenix), before the daily-brief-media mirror
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect book audio
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_MB: ${{ inputs.budget_mb || '900' }}
          SRC_REPO: carl-m-healy/daily-brief
        run: |
          set -euo pipefail
          mkdir -p _site
          gh api --paginate "repos/$SRC_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^books-[a-z0-9-]+$")) | .tag_name as $t | .assets[] | [$t, .name, (.size|tostring), .url] | @tsv' \
            | sort -t$'\t' -k1,1 -k2,2 > assets.tsv
          budget=$(( BUDGET_MB * 1000000 )); used=0; n=0
          while IFS=$'\t' read -r tag name size url; do
            [[ "$name" =~ ^ch-[0-9]{1,3}\.mp3$ ]] || continue
            if (( used + size > budget )); then echo "budget full at $name"; continue; fi
            d="_site/${tag#books-}"; mkdir -p "$d"
            curl -sSfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$d/$name" "$url"
            used=$(( used + size )); n=$(( n + 1 ))
          done < assets.tsv
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '<!doctype html><meta name="robots" content="noindex"><title>Not found</title>' > _site/index.html
          touch _site/.nojekyll
          echo "mirrored $n files, $(( used / 1000000 )) MB"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
